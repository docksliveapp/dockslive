<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dplGoldGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="dplMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="70%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="dplShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#dplShadow)" transform="translate(40, 20)">
    <!-- Speed stripes on Left -->
    <rect x="0" y="42" width="46" height="13" rx="2" fill="url(#dplGoldGrad)"/>
    <rect x="0" y="63" width="34" height="13" rx="2" fill="url(#dplGoldGrad)"/>

    <!-- 'D' letter with geometric angled cut -->
    <path d="M 52,42 L 140,42 C 168,42 186,58 186,92 C 186,128 168,142 140,142 L 52,142 L 94,92 L 52,42 Z M 98,63 L 98,121 L 134,121 C 150,121 160,110 160,92 C 160,74 150,63 134,63 L 98,63 Z" fill="url(#dplGoldGrad)"/>

    <!-- 'P' letter bold -->
    <path d="M 194,42 L 274,42 C 302,42 322,58 322,88 C 322,118 302,134 274,134 L 234,134 L 234,178 L 194,178 L 194,42 Z M 234,63 L 234,113 L 268,113 C 280,113 288,104 288,88 C 288,72 280,63 268,63 L 234,63 Z" fill="url(#dplGoldGrad)"/>

    <!-- 'L' letter with speed extension -->
    <path d="M 330,42 L 372,42 L 372,113 L 420,113 L 420,142 L 330,142 L 330,42 Z" fill="url(#dplGoldGrad)"/>

    <!-- Speed stripes on Right -->
    <rect x="428" y="113" width="48" height="13" rx="2" fill="url(#dplGoldGrad)"/>
    <rect x="428" y="132" width="36" height="10" rx="2" fill="url(#dplGoldGrad)"/>
  </g>

  <!-- Title & Subtitle Below -->
  <text x="300" y="196" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        text-anchor="middle">
    DOCKS (PVT.) LTD.
  </text>
  <text x="300" y="218" 
        font-family="'Montserrat', sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#FBBF24" 
        text-anchor="middle">
    CUSTOMS BONDED CARRIER • FREIGHT LOGISTICS
  </text>
</svg>
