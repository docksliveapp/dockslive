<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Solid Black Background -->
  <rect width="512" height="512" rx="100" fill="#000000" />

  <!-- Circular Blue Accent Ring (matching Google Profile Avatar) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#2563EB" stroke-width="7" />

  <!-- Center DPL Wings Logo (scale 0.165, centered at 256, 256) -->
  <g transform="translate(91, 214) scale(0.165)">
    <!-- Speed stripes left -->
    <path d="M50 80 L350 80 L300 140 L0 140 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M80 180 L420 180 L370 240 L30 240 Z" fill="url(#goldGrad)" />
    <path d="M120 280 L480 280 L430 340 L70 340 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- D Letter -->
    <path d="M520 60 L850 60 C1050 60 1150 140 1150 280 C1150 420 1050 500 850 500 L520 500 Z M670 170 L670 390 L820 390 C950 390 1000 340 1000 280 C1000 220 950 170 820 170 Z" fill="url(#goldGrad)" />

    <!-- P Letter -->
    <path d="M1200 60 L1520 60 C1680 60 1760 120 1760 240 C1760 360 1680 420 1520 420 L1350 420 L1350 620 L1200 620 Z M1350 170 L1350 310 L1500 310 C1590 310 1620 280 1620 240 C1620 200 1590 170 1500 170 Z" fill="url(#goldGrad)" />

    <!-- L Letter -->
    <path d="M1820 60 L1970 60 L1970 390 L2250 390 L2250 500 L1820 500 Z" fill="url(#goldGrad)" />

    <!-- Speed stripes right -->
    <path d="M2320 180 L2620 180 L2570 240 L2270 240 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M2290 280 L2660 280 L2610 340 L2240 340 Z" fill="url(#goldGrad)" />
    <path d="M2260 380 L2560 380 L2510 440 L2210 440 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
