<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="favGoldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#936806"/>
    </linearGradient>

    <linearGradient id="favGoldMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#E6C665"/>
      <stop offset="50%" stop-color="#BF9024"/>
      <stop offset="70%" stop-color="#E2C15E"/>
      <stop offset="100%" stop-color="#8C6207"/>
    </linearGradient>

    <radialGradient id="favNavyCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E213D"/>
      <stop offset="65%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#030812"/>
    </radialGradient>

    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Transparent Background Medallion -->
  <g filter="url(#favShadow)">
    <circle cx="400" cy="400" r="380" fill="url(#favGoldOuter)" stroke="#4A3405" stroke-width="4"/>
    <circle cx="400" cy="400" r="366" fill="#0A1628" stroke="url(#favGoldMetallic)" stroke-width="6"/>

    <circle cx="400" cy="400" r="320" stroke="url(#favGoldMetallic)" stroke-width="6" fill="none"/>
    <circle cx="400" cy="400" r="310" fill="url(#favNavyCenter)" stroke="#1E293B" stroke-width="3"/>

    <!-- Gear Teeth -->
    <circle cx="400" cy="400" r="236" fill="none" stroke="url(#favGoldMetallic)" stroke-width="14"/>

    <!-- Inner Core Golden Disc -->
    <circle cx="400" cy="400" r="172" fill="#0C1B33" stroke="url(#favGoldMetallic)" stroke-width="8"/>

    <!-- "MAK" Bold Typography -->
    <text x="400" y="388" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
          font-size="94" 
          font-weight="900" 
          letter-spacing="6" 
          fill="url(#favGoldMetallic)" 
          stroke="#453106" 
          stroke-width="2" 
          text-anchor="middle">
      MAK
    </text>

    <!-- Subtitle: GROUP OF COMPANIES -->
    <text x="400" y="426" 
          font-family="'Montserrat', sans-serif" 
          font-size="17" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#FDE68A" 
          text-anchor="middle">
      GROUP OF COMPANIES
    </text>

    <line x1="280" y1="440" x2="520" y2="440" stroke="url(#favGoldMetallic)" stroke-width="2"/>

    <text x="400" y="462" 
          font-family="'Montserrat', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#CBD5E1" 
          text-anchor="middle">
      DOCKS • TRUCKIT
    </text>
    <text x="400" y="482" 
          font-family="'Montserrat', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#CBD5E1" 
          text-anchor="middle">
      MUHIB • VANTAGE
    </text>

    <!-- 4 Orbiting Company Badges -->
    <!-- Top: DPL -->
    <g transform="translate(400, 160)">
      <circle cx="0" cy="0" r="68" fill="#0A1628" stroke="url(#favGoldMetallic)" stroke-width="7"/>
      <text x="0" y="8" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="url(#favGoldMetallic)" text-anchor="middle">DPL</text>
    </g>

    <!-- Left: MI -->
    <g transform="translate(160, 400)">
      <circle cx="0" cy="0" r="68" fill="#0A1628" stroke="url(#favGoldMetallic)" stroke-width="7"/>
      <path d="M -42,-8 A 44,44 0 1,1 40,12" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
      <path d="M 40,12 A 44,44 0 1,1 -42,-8" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <text x="-12" y="8" font-family="'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#3B82F6" text-anchor="middle">M</text>
      <text x="14" y="8" font-family="'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="middle">I</text>
    </g>

    <!-- Right: VLS -->
    <g transform="translate(640, 400)">
      <circle cx="0" cy="0" r="68" fill="#0A1628" stroke="url(#favGoldMetallic)" stroke-width="7"/>
      <path d="M -22,-18 A 28,28 0 0,1 22,-18" fill="none" stroke="#FBBF24" stroke-width="3"/>
      <text x="0" y="8" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle">VLS</text>
    </g>

    <!-- Bottom: TRUCKIT -->
    <g transform="translate(400, 640)">
      <circle cx="0" cy="0" r="68" fill="#0A1628" stroke="url(#favGoldMetallic)" stroke-width="7"/>
      <!-- Slat and cab -->
      <rect x="-24" y="-12" width="20" height="5" rx="1.5" fill="#94A3B8"/>
      <rect x="-24" y="-4" width="20" height="5" rx="1.5" fill="#94A3B8"/>
      <path d="M 2,-12 L 18,-12 Q 24,-12 24,-2 L 2,-2 Z" fill="#EF4444"/>
      <circle cx="6" cy="8" r="4" fill="#DC2626"/>
      <circle cx="18" cy="8" r="4" fill="#DC2626"/>
    </g>
  </g>
</svg>
