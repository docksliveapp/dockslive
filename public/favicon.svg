<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian Slate Luxury) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <!-- Outer Rim Gold Foil Metallic Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F5B938"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- MAK Wordmark Platinum-Gold Metallic Gradient -->
    <linearGradient id="makMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FEF3C7"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Subtitle Gold Gradient -->
    <linearGradient id="subGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Radial Central Luster Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bevel & 3D Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FDE047" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Rounded Squircle Base Tile -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="8"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#centerGlow)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Centered MAK Group of Companies Logo Group -->
  <g transform="translate(24, 142) scale(0.455)" filter="url(#iconShadow)">
    <!-- ==================== LETTER "M" ==================== -->
    <path d="M 50,50 
             L 155,50 
             L 245,215 
             L 335,50 
             L 440,50 
             L 440,340 
             L 345,340 
             L 345,175 
             L 270,305 
             L 220,305 
             L 145,175 
             L 145,340 
             L 50,340 
             Z" 
          fill="url(#makMetallic)" 
          stroke="#78350F" 
          stroke-width="3" />

    <!-- ==================== LETTER "A" ==================== -->
    <path fill-rule="evenodd" d="M 465,340 
             L 465,150 
             C 465,75 515,50 595,50 
             C 675,50 725,75 725,150 
             L 725,340 
             L 630,340 
             L 630,270 
             L 560,270 
             L 560,340 
             Z
             M 560,200 
             L 630,200 
             L 630,145 
             C 630,118 618,105 595,105 
             C 572,105 560,118 560,145 
             Z" 
          fill="url(#makMetallic)" 
          stroke="#78350F" 
          stroke-width="3" />

    <!-- ==================== LETTER "K" ==================== -->
    <path d="M 750,50 
             L 845,50 
             L 845,340 
             L 750,340 
             Z" 
          fill="url(#makMetallic)" 
          stroke="#78350F" 
          stroke-width="3" />

    <path d="M 845,215 
             L 935,50 
             L 1060,50 
             L 940,230 
             L 1070,340 
             L 945,340 
             L 845,225 
             Z" 
          fill="url(#makMetallic)" 
          stroke="#78350F" 
          stroke-width="3" />

    <!-- ==================== HORIZONTAL DIVIDER RULE ==================== -->
    <rect x="50" y="375" width="1020" height="9" rx="4.5" fill="url(#goldRim)" />

    <!-- ==================== SUBTITLE: GROUP OF COMPANIES ==================== -->
    <text x="560" y="445" 
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-size="50" 
          font-weight="900" 
          letter-spacing="18" 
          fill="url(#subGold)" 
          text-anchor="middle">
      GROUP OF COMPANIES
    </text>
  </g>
</svg>
