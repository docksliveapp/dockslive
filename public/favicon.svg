<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="silver" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E6E8EB"/>
      <stop offset="100%" stop-color="#C2C6CB"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer border -->
  <circle cx="500" cy="500" r="475" fill="#2E3F5E"/>
  
  <!-- Inner silver button -->
  <circle cx="500" cy="500" r="430" fill="url(#silver)"/>
  
  <!-- Gloss highlight -->
  <ellipse cx="500" cy="380" rx="340" ry="180" fill="url(#gloss)"/>
  <path d="M 200 250 Q 500 100 800 250" stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- MAK Text -->
  <g transform="translate(500, 500)">
    <text x="0" y="-15" font-family="Arial Black, Inter, sans-serif" font-weight="900" font-size="280" fill="#2E3F5E" text-anchor="middle" letter-spacing="-8" style="font-stretch: condensed;">MAK</text>
  </g>
  
  <!-- Divider line -->
  <line x1="140" y1="580" x2="860" y2="580" stroke="#1A2A40" stroke-width="4" opacity="0.9"/>
  
  <!-- GROUP OF COMPANIES -->
  <text x="500" y="640" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#1A2A40" text-anchor="middle" letter-spacing="7">GROUP OF COMPANIES</text>
  
  <!-- Sub-logos row -->
  <g transform="translate(0, 700)">
    <!-- DPL -->
    <g transform="translate(180, 0)">
      <text x="0" y="0" font-family="Arial Black" font-weight="900" font-size="62" fill="#C19A2E" text-anchor="middle" letter-spacing="-2">DPL</text>
      <text x="0" y="28" font-family="Arial" font-size="16" fill="#222" text-anchor="middle">Doora Pvt Ltd</text>
    </g>
    <!-- Truckit -->
    <g transform="translate(380, -5)">
      <g transform="translate(-35, -35)">
        <rect x="0" y="0" width="45" height="14" rx="7" fill="#4A4E5A"/>
        <rect x="48" y="0" width="35" height="14" rx="7" fill="#D32F2F"/>
        <rect x="0" y="18" width="45" height="14" rx="7" fill="#4A4E5A"/>
        <rect x="48" y="18" width="45" height="14" rx="7" fill="#D32F2F"/>
        <rect x="0" y="36" width="30" height="14" rx="7" fill="#4A4E5A"/>
        <circle cx="40" cy="50" r="5" fill="#D32F2F"/><circle cx="55" cy="50" r="5" fill="#D32F2F"/>
      </g>
      <text x="0" y="38" font-family="Arial" font-size="16" fill="#222" text-anchor="middle">Truckit Pvt Ltd</text>
    </g>
    <!-- Muhib International -->
    <g transform="translate(580, 0)">
      <g transform="translate(0, -40)">
        <ellipse cx="0" cy="10" rx="38" ry="30" fill="none" stroke="#C1272D" stroke-width="6"/>
        <ellipse cx="0" cy="10" rx="38" ry="30" fill="none" stroke="#1E4DB7" stroke-width="6" stroke-dasharray="60 120" transform="rotate(40 0 10)"/>
        <text x="0" y="18" font-family="Arial Black" font-size="28" fill="#1E4DB7" text-anchor="middle" font-weight="900">M</text>
        <text x="16" y="18" font-family="Arial Black" font-size="22" fill="#C1272D" text-anchor="middle" font-weight="900">I</text>
      </g>
      <text x="0" y="28" font-family="Arial" font-size="14.5" fill="#222" text-anchor="middle">Muhib International SMC Pvt Ltd</text>
    </g>
    <!-- Vantage -->
    <g transform="translate(820, 0)">
      <g transform="translate(0, -45)">
        <path d="M -30 20 L -10 10 L 30 10 L 20 20 Z" fill="none" stroke="#F7B500" stroke-width="3"/>
        <rect x="-28" y="12" width="6" height="10" fill="white" stroke="#333" stroke-width="0.5"/>
        <rect x="-20" y="12" width="6" height="10" fill="white" stroke="#333" stroke-width="0.5"/>
        <rect x="-12" y="12" width="6" height="10" fill="white" stroke="#333" stroke-width="0.5"/>
        <rect x="-4" y="12" width="6" height="10" fill="white" stroke="#333" stroke-width="0.5"/>
        <path d="M -30 22 Q 0 35 35 22 L 25 35 Q 0 48 -25 35 Z" fill="#00A0E3" stroke="#005A9C" stroke-width="1"/>
        <text x="0" y="38" font-family="Arial Black" font-size="26" fill="#00A0E3" text-anchor="middle" font-style="italic" font-weight="900">VSL</text>
      </g>
      <text x="0" y="28" font-family="Arial" font-size="16" fill="#222" text-anchor="middle">Vantage Shipping Line</text>
    </g>
  </g>
</svg>
