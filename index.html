    <script>
      // Clear stale service workers and caches on preview/dev domains to prevent hangs
      if ('serviceWorker' in navigator && (window.location.hostname.includes('ais-') || window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1'))) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) {
            reg.unregister();
          }
        });
        if (typeof caches !== 'undefined') {
          caches.keys().then(function(keys) {
            for (var key of keys) {
              caches.delete(key);
            }
          });
        }
      }
    </script>
    <meta name="theme-color" content="#0a1224" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      // Suppress harmless Vite HMR WebSocket connection warnings in iframes
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('send was called before connect') || e.message.includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('send was called before connect') || e.reason.message.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
