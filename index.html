    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          if (h.includes('vehicle.') || h.includes('fleet.')) {
            document.title = 'Vehicle Status & Fleet Verification • vehicle.makpk.online';
          } else if (h.includes('status.') || h.includes('sttatus.') || h.includes('container.') || h.includes('track.')) {
            document.title = 'Shipment & Container Status • status.makpk.online';
          }
        } catch (_) {}
      })();
    </script>

    <script>
      // Universal Stale Cache & Chunk Auto-Recovery
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('Loading chunk') > -1 || msg.indexOf('Importing a module script failed') > -1) {
          if (!sessionStorage.getItem('dpl_bundle_auto_healed')) {
            sessionStorage.setItem('dpl_bundle_auto_healed', '1');
            if (typeof caches !== 'undefined') {
              caches.keys().then(function(names) {
                Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" id="app-theme-color-meta" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <meta property="og:title" content="MAK Group of Companies" />
    <meta property="og:description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <script>
      // Synchronous Pre-Render Theme, Session & Layout State Hydration (Prevents any screen flicker)
      (function() {
        try {
          var savedTheme = localStorage.getItem('dpl_app_theme');
          var isCharcoal = savedTheme === 'charcoal' || savedTheme === 'dark';
          var themeClass = isCharcoal ? 'theme-charcoal' : 'theme-pearl';
          var bgHex = isCharcoal ? '#0B0F17' : '#F8FAFC';

          document.documentElement.classList.remove('theme-pearl', 'theme-charcoal');
          document.documentElement.classList.add(themeClass);
          document.documentElement.setAttribute('data-theme', isCharcoal ? 'charcoal' : 'pearl');
          document.documentElement.style.backgroundColor = bgHex;

          var metaTheme = document.getElementById('app-theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', bgHex);
          }

          // Pre-warm layout & session state on window for synchronous React hydration
          window.__MAK_INITIAL_STATE__ = {
            theme: isCharcoal ? 'charcoal' : 'pearl',
            activeCompanyId: localStorage.getItem('dpl_active_company_id') || 'docks',
            sessionActive: localStorage.getItem('dpl_session_active') === 'true',
            lastView: localStorage.getItem('dpl_last_location_view') || 'dashboard',
            lastRole: localStorage.getItem('dpl_last_location_role') || null
          };

          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
            });
          }
        } catch (_) {}
      })();

      // Native APK Gesture Protection: Disable long-press context menu on images, icons, and navigation bars
      window.addEventListener('contextmenu', function(e) {
        var target = e.target;
        if (!target) return;
        var tagName = (target.tagName || '').toUpperCase();
        if (tagName === 'INPUT' || tagName === 'TEXTAREA' || target.isContentEditable) {
          return;
        }
        if (tagName === 'IMG' || tagName === 'SVG' || tagName === 'PATH' || tagName === 'BUTTON' || tagName === 'A' || (target.closest && target.closest('nav, header, aside, button, img, svg'))) {
          e.preventDefault();
        }
      }, { passive: false });

      window.addEventListener('dragstart', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'IMG' || target.tagName === 'A' || target.tagName === 'SVG')) {
          e.preventDefault();
        }
      }, { passive: false });

      // Suppress harmless Vite HMR WebSocket connection warnings in iframes
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('send was called before connect') || e.message.includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('send was called before connect') || e.reason.message.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* True Native App Viewport Lock, Safe-Area Insets & Instant Skeleton Shimmer */
      :root, html, body {
        color-scheme: only light !important;
        forced-color-adjust: none !important;
        -webkit-forced-color-adjust: none !important;
        height: 100dvh;
        max-height: 100dvh;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        height: 100dvh;
        max-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: none;
      }
      @keyframes makSkeletonPulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 0.3; }
      }
      .mak-boot-skeleton {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
        padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px) 20px;
        box-sizing: border-box;
        gap: 16px;
      }
      .mak-boot-bar {
        height: 56px;
        border-radius: 14px;
        background: rgba(148, 163, 184, 0.16);
        animation: makSkeletonPulse 1.4s ease-in-out infinite;
      }
      .mak-boot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .mak-boot-card {
        height: 112px;
        border-radius: 16px;
        background: rgba(148, 163, 184, 0.14);
        animation: makSkeletonPulse 1.4s ease-in-out infinite;
      }
      .mak-boot-panel {
        flex: 1;
        border-radius: 18px;
        background: rgba(148, 163, 184, 0.12);
        animation: makSkeletonPulse 1.4s ease-in-out infinite;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="theme-pearl">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('dpl_app_theme');
          if (t === 'charcoal' || t === 'dark') {
            document.body.classList.remove('theme-pearl');
            document.body.classList.add('theme-charcoal');
            document.body.style.backgroundColor = '#0B0F17';
          } else {
            document.body.style.backgroundColor = '#F8FAFC';
          }
        } catch (_) {}
      })();
    </script>
    <div id="root">
      <!-- Instant Pre-Hydration Skeleton Shell (Replaced seamlessly when React mounts) -->
      <div class="mak-boot-skeleton" aria-hidden="true">
        <div class="mak-boot-bar"></div>
        <div class="mak-boot-grid">
          <div class="mak-boot-card"></div>
          <div class="mak-boot-card"></div>
          <div class="mak-boot-card"></div>
          <div class="mak-boot-card"></div>
        </div>
        <div class="mak-boot-panel"></div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
