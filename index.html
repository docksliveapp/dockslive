    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          if (h.includes('vehicle.') || h.includes('fleet.')) {
            document.title = 'Vehicle Status & Fleet Verification • vehicle.makpk.online';
          } else if (h.includes('status.') || h.includes('sttatus.') || h.includes('container.') || h.includes('track.')) {
            document.title = 'Shipment & Container Status • status.makpk.online';
          }
        } catch (_) {}
      })();
    </script>

    <script>
      // Universal Stale Cache & Chunk Auto-Recovery
      // Prevents hangs when new application builds are published
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('Loading chunk') > -1 || msg.indexOf('Importing a module script failed') > -1) {
          if (!sessionStorage.getItem('dpl_bundle_auto_healed')) {
            sessionStorage.setItem('dpl_bundle_auto_healed', '1');
            if (typeof caches !== 'undefined') {
              caches.keys().then(function(names) {
                Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>

    <script>
      // Suppress harmless Vite HMR WebSocket connection warnings in iframes
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('send was called before connect') || e.message.includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('send was called before connect') || e.reason.message.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
