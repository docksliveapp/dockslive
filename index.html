    <meta http-equiv="Expires" content="0" />
    <title>MAK-GROUP</title>
    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          if (h.includes('vehicle.') || h.includes('fleet.')) {
            document.title = 'Vehicle Status & Fleet Verification • vehicle.makpk.online';
          } else if (h.includes('status.') || h.includes('sttatus.') || h.includes('container.') || h.includes('track.')) {
            document.title = 'Shipment & Container Status • status.makpk.online';
          }
        } catch (_) {}
      })();
    </script>

    <script>
      // Universal Stale Cache & Chunk Auto-Recovery
      // Prevents hangs when new application builds are published
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('Loading chunk') > -1 || msg.indexOf('Importing a module script failed') > -1) {
          if (!sessionStorage.getItem('dpl_bundle_auto_healed')) {
            sessionStorage.setItem('dpl_bundle_auto_healed', '1');
            if (typeof caches !== 'undefined') {
              caches.keys().then(function(names) {
                Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAK Group" />
    <meta name="application-name" content="MAK Group of Companies" />
    <meta name="description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <meta property="og:title" content="MAK Group of Companies" />
    <meta property="og:description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <script>
      // Automatic Cache Reset on Every Page Refresh / Domain Open & Instant Theme Sync
      (function() {
        try {
          if (typeof caches !== 'undefined') {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]).catch(function() {});
              }
            }).catch(function() {});
          }
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var j = 0; j < regs.length; j++) {
                regs[j].unregister().catch(function() {});
              }
            }).catch(function() {});
          }
          var savedTheme = localStorage.getItem('dpl_app_theme');
          var isCharcoal = savedTheme === 'charcoal' || savedTheme === 'dark';
          var themeClass = isCharcoal ? 'theme-charcoal' : 'theme-pearl';
          document.documentElement.classList.remove('theme-pearl', 'theme-charcoal');
          document.documentElement.classList.add(themeClass);
          document.documentElement.setAttribute('data-theme', isCharcoal ? 'charcoal' : 'pearl');
        } catch (_) {}
      })();

      // Suppress harmless Vite HMR WebSocket connection warnings in iframes
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('send was called before connect') || e.message.includes('WebSocket'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('send was called before connect') || e.reason.message.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>

      /* Prevent Mobile Browser Force-Dark Inversion & Enforce International Typography */
      :root, html, body {
        color-scheme: only light !important;
        forced-color-adjust: none !important;
        -webkit-forced-color-adjust: none !important;
        min-height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;

        -webkit-font-smoothing: antialiased;

      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="theme-pearl">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('dpl_app_theme');
          if (t === 'charcoal' || t === 'dark') {
            document.body.classList.remove('theme-pearl');
            document.body.classList.add('theme-charcoal');
          }
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
